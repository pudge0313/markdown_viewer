<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'none'">
  <title>Markdown 查看器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ======= 顶部工具栏 ======= -->
  <header id="titlebar">
    <div id="tab">
      <svg id="tab-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <rect x="3.5" y="5"  width="4.5" height="1.2" rx="0.6" fill="currentColor"/>
        <rect x="3.5" y="7.6" width="4.5" height="1.2" rx="0.6" fill="currentColor"/>
        <rect x="10" y="5" width="2.6" height="4" rx="0.4" fill="currentColor"/>
      </svg>
      <span id="tab-label">预览</span>
      <button id="tab-close" title="关闭文件" aria-label="关闭文件">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btn-open" title="打开 Markdown 文件 (Ctrl+O)">
      <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2.5h-6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-6"/>
        <path d="M6.5 9.5L13.5 2.5"/>
        <path d="M10 2.5h3.5V6"/>
      </svg>
    </button>
    <button class="tb-btn" id="btn-sidebar" title="文件列表 (Ctrl+B)">
      <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.1">
        <rect x="2" y="2.5" width="12" height="11" rx="1"/>
        <line x1="6.2" y1="2.5" x2="6.2" y2="13.5"/>
      </svg>
    </button>
    <button class="tb-btn" id="btn-more" title="更多">
      <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor">
        <circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/>
      </svg>
    </button>
  </header>

  <!-- ======= 主体 ======= -->
  <div id="main">
    <aside id="sidebar" hidden>
      <div class="sb-head">文件</div>
      <div id="sb-current"></div>
      <div id="sb-tree"></div>
    </aside>

    <div id="content">
      <!-- 欢迎页 -->
      <div id="welcome">
        <div class="wl-logo">
          <svg viewBox="0 0 208 128" width="96" height="60" aria-hidden="true">
            <rect x="2" y="2" width="204" height="124" rx="10" fill="none" stroke="#4a4d52" stroke-width="6"/>
            <path d="M30 98V30l28 34 28-34v68" fill="none" stroke="#8a9199" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M162 30v46M162 76l-16-18M162 76l16-18" fill="none" stroke="#8a9199" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </div>
        <h2>Markdown 查看器</h2>
        <p class="wl-sub">打开并阅读本地 .md 文档</p>
        <button id="wl-open">打开 Markdown 文件…</button>
        <p class="wl-hint">也可以把 .md 文件拖到本窗口，或直接双击文件打开</p>
        <div id="wl-recents" hidden>
          <div class="wl-sec">最近打开</div>
          <ul id="wl-recent-list"></ul>
        </div>
      </div>

      <!-- Markdown 渲染区 -->
      <article id="view" hidden tabindex="-1"></article>
    </div>
  </div>

  <!-- 关于 -->
  <dialog id="about-dlg">
    <h3>Markdown 查看器</h3>
    <p>版本 1.1.0</p>
    <p class="dlg-sub">本地 Markdown 文档阅读工具</p>
    <form method="dialog"><button>关闭</button></form>
  </dialog>

  <button id="theme-toggle" title="切换深色 / 浅色模式" aria-label="切换深色 / 浅色模式">
    <svg class="icon-moon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
      <path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <circle cx="8" cy="8" r="3.2"/>
      <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M2.9 2.9l1.2 1.2M11.9 11.9l1.2 1.2M13.1 2.9l-1.2 1.2M4.1 11.9l-1.2 1.2"/>
    </svg>
  </button>
  <script src="app.js"></script>
</body>
</html>
